name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # docs/ (pitcher PDFs such as throwing programs) is published next to the app but is not part of www/,
      # so the native builds, which bundle www/, do not carry those files.
      - name: Assemble the site (www + docs)
        run: |
          mkdir -p _site
          cp -r www/. _site/
          if [ -d docs ]; then cp -r docs _site/docs; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
