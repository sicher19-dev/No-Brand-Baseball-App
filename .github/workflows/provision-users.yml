# Creates the backend login for every pitcher in www/roster.js and marks the coach accounts.
# Run it after adding pitchers to the roster, or with reset_passwords after fixing a name.
# Needs secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY (Supabase -> Project Settings -> API).
# Coach emails come from the COACH_EMAILS secret (comma-separated; a secret so they are masked in public logs).
# Username coaches come from the COACH_LOGINS secret: one "username:password:Display Name" per line.
# Pitchers with their own password (roster entry has auth: "password") come from the PITCHER_LOGINS secret:
# one "pitcher_id:password" per line. Those passwords are applied on every run, so editing the secret and
# re-running is how you change one.
name: Provision app users

on:
  workflow_dispatch:
    inputs:
      reset_passwords:
        description: "Also reset every pitcher's derived password (use after a roster name change)"
        type: boolean
        default: false
      resend_coach_links:
        description: "Email a fresh set-password link to coaches who have never signed in"
        type: boolean
        default: false
      reset_coach_passwords:
        description: "Also reset the password of every username coach in the COACH_LOGINS secret"
        type: boolean
        default: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Provision users
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COACH_EMAILS: ${{ secrets.COACH_EMAILS || vars.COACH_EMAILS || 'nobrandbaseball@gmail.com' }}
          COACH_LOGINS: ${{ secrets.COACH_LOGINS }}
          PITCHER_LOGINS: ${{ secrets.PITCHER_LOGINS }}
        run: node tools/provision_users.mjs ${{ inputs.reset_passwords && '--reset-passwords' || '' }} ${{ inputs.resend_coach_links && '--resend-coach-links' || '' }} ${{ inputs.reset_coach_passwords && '--reset-coach-passwords' || '' }}
