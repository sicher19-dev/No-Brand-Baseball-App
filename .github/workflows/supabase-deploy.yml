# Applies supabase/schema.sql to the live project and deploys the push edge function + its trigger.
# Runs on every push that touches supabase/**, or by hand. Replaces pasting SQL into the dashboard.
#
# Secrets: SUPABASE_ACCESS_TOKEN (supabase.com -> Account -> Access Tokens), SUPABASE_SERVICE_ROLE_KEY (already set).
# For push: APNS_KEY_ID, APNS_KEY_CONTENT (the APNs .p8, base64 or raw text), APPLE_TEAM_ID (already set).
# Without the APNs secrets the schema still applies and the function deploys; it just reports "APNs not configured".
name: Supabase - deploy

on:
  push:
    branches: [main]
    paths: ["supabase/**", "tools/supabase_sql.mjs", ".github/workflows/supabase-deploy.yml"]
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: qmsjapplovtvkxxkbdmw

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Create one at https://supabase.com/dashboard/account/tokens and add it as a repo secret."
            exit 1
          fi

      - name: Apply database schema
        run: node tools/supabase_sql.mjs supabase/schema.sql

      - name: Deploy push function
        run: npx --yes supabase@2 functions deploy push --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Function secrets and webhook trigger
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_KEY_CONTENT: ${{ secrets.APNS_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # The trigger and the function share a secret derived from the service key, so nothing extra to manage.
          PUSH_SECRET="$(printf '%s' "push:$SERVICE_KEY" | sha256sum | cut -c1-48)"
          echo "::add-mask::$PUSH_SECRET"
          ARGS=(PUSH_SECRET="$PUSH_SECRET" APNS_TOPIC=com.nobrandbaseball.app)
          if [ -n "$APNS_KEY_CONTENT" ] && [ -n "$APNS_KEY_ID" ]; then
            case "$APNS_KEY_CONTENT" in
              *BEGIN*) KEY="$APNS_KEY_CONTENT" ;;
              *) KEY="$(printf '%s' "$APNS_KEY_CONTENT" | base64 -d)" ;;
            esac
            ARGS+=(APNS_KEY="$KEY" APNS_KEY_ID="$APNS_KEY_ID" APNS_TEAM_ID="$APPLE_TEAM_ID")
            echo "APNs key present: push will send."
          else
            echo "::warning::APNS_KEY_ID / APNS_KEY_CONTENT not set yet: function deployed, but it cannot send until they are."
          fi
          npx --yes supabase@2 secrets set --project-ref "$SUPABASE_PROJECT_REF" "${ARGS[@]}"
          PUSH_SECRET="$PUSH_SECRET" node tools/supabase_sql.mjs supabase/push_webhook.sql
