<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feature graphic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body { background: #0b0b0d; color: #efece4; font-family: 'Archivo', system-ui, sans-serif; position: relative; }
  .glow { position: absolute; left: -120px; top: -160px; width: 620px; height: 620px; border-radius: 50%;
          background: radial-gradient(closest-side, rgba(245,183,0,.22), rgba(245,183,0,0)); }
  .wrap { position: absolute; left: 84px; top: 0; height: 500px; display: flex; align-items: center; gap: 44px; }
  .mark { width: 150px; height: 150px; border-radius: 36px; background: #f5b700; color: #0b0b0d; font-weight: 900; font-size: 64px;
          letter-spacing: -3px; display: flex; align-items: center; justify-content: center; box-shadow: 0 18px 50px rgba(245,183,0,.28); }
  .name { font-weight: 900; font-size: 72px; line-height: .95; letter-spacing: -2px; }
  .name span { display: block; color: #f5b700; }
  .tag { margin-top: 18px; font-size: 24px; color: #8e8e96; font-weight: 500; }
  .pills { margin-top: 22px; display: flex; gap: 10px; }
  .pill { font-family: 'JetBrains Mono', monospace; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: #efece4;
          background: #191920; border: 1px solid #2a2a33; border-radius: 999px; padding: 8px 14px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="mark">NB</div>
    <div>
      <div class="name">NO BRAND<span>BASEBALL</span></div>
      <div class="tag">Pitcher portal from No Brand Baseball Analytics</div>
      <div class="pills"><span class="pill">Scouting reports</span><span class="pill">Assessments</span><span class="pill">Coach messages</span></div>
    </div>
  </div>
</body>
</html>
